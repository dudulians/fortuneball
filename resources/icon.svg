<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4a4a7a"/>
      <stop offset="100%" stop-color="#15152a"/>
    </radialGradient>
    <radialGradient id="ballBody" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="25%" stop-color="#15151d"/>
      <stop offset="75%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="ballHighlight" cx="33%" cy="22%" r="32%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background fill (rounded by Android's adaptive mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Ball centered -->
  <g transform="translate(512 512)">
    <circle cx="0" cy="0" r="360" fill="url(#ballBody)"/>
    <ellipse cx="-112" cy="-155" rx="175" ry="110"
      fill="url(#ballHighlight)" transform="rotate(-25)"/>

    <!-- White circle with 8 -->
    <circle cx="0" cy="0" r="125" fill="#f5f5f5"/>
    <circle cx="0" cy="0" r="125" fill="url(#ballHighlight)" opacity="0.35"/>
    <text x="0" y="62" font-size="170" font-weight="900"
      text-anchor="middle" fill="#0a0a0a"
      font-family="Georgia, serif">8</text>
  </g>
</svg>
