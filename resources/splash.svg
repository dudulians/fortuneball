<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4a4a7a"/>
      <stop offset="55%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#15152a"/>
    </radialGradient>
    <radialGradient id="ballBody" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="25%" stop-color="#15151d"/>
      <stop offset="75%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="ballHighlight" cx="33%" cy="22%" r="32%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="90%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="triangle" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#6aa7ff"/>
      <stop offset="55%" stop-color="#2b5bd8"/>
      <stop offset="100%" stop-color="#0a1e4a"/>
    </radialGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- Title -->
  <text x="1366" y="780" font-size="110" font-weight="300"
    letter-spacing="44" text-anchor="middle"
    fill="#ffffff" fill-opacity="0.85"
    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
    FORTUNE BALL
  </text>

  <!-- Ball -->
  <g transform="translate(1366 1400)">
    <circle cx="0" cy="0" r="500" fill="url(#ballBody)"/>
    <ellipse cx="-155" cy="-215" rx="240" ry="150"
      fill="url(#ballHighlight)" transform="rotate(-25)"/>
    <!-- Blue answer window -->
    <circle cx="0" cy="38" r="275" fill="url(#window)"/>
    <circle cx="0" cy="38" r="275" fill="none"
      stroke="#1a1a26" stroke-width="10"/>
    <polygon points="-213,-113 213,-113 0,212"
      fill="url(#triangle)"/>
  </g>

  <!-- Tagline / how-it-works -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
     text-anchor="middle" fill="#ffffff">
    <text x="1366" y="2140" font-size="72" font-weight="600"
      fill-opacity="0.88" letter-spacing="4">
      Your pocket oracle
    </text>
    <text x="1366" y="2260" font-size="52" font-weight="400"
      fill-opacity="0.55" letter-spacing="2">
      Ask a yes-or-no question,
    </text>
    <text x="1366" y="2340" font-size="52" font-weight="400"
      fill-opacity="0.55" letter-spacing="2">
      shake the phone — get an answer.
    </text>
  </g>
</svg>
